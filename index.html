<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Take Canvas DEV 0.2.5</title><style>
*{box-sizing:border-box}button,.name,.wave{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}button{touch-action:manipulation}.name b{cursor:pointer;touch-action:manipulation}body{margin:0;background:#101720;color:#e9edf3;font:14px -apple-system,BlinkMacSystemFont,sans-serif}button,label.pick{border:1px solid #405168;background:#24364b;color:white;padding:9px 13px;border-radius:8px;cursor:pointer}header,footer{height:74px;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #36475b;gap:12px}header strong{letter-spacing:2px}.project{text-align:center}.project small{display:block;color:#94a6bb}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 260px;height:calc(100dvh - 148px)}main{overflow-y:auto;min-width:0}.bar{padding:10px 16px;background:#182435;color:#9cadc1;position:sticky;top:0;z-index:4}#pinned:not(:empty){position:sticky;top:38px;z-index:3;background:#1b3040;border-bottom:2px solid #5f99a5}.take{display:grid;grid-template-columns:115px minmax(0,1fr);height:83px;border-bottom:1px solid #2c3a4a}.take.active{background:#1b2e45}.name{touch-action:none;padding:10px;display:flex;flex-direction:column;gap:5px;min-width:0}.name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.name small{color:#9caec1}.name button{font-size:11px;padding:3px;width:56px}.wave{position:relative;overflow:hidden;background:#15202d;touch-action:none;-webkit-user-select:none;user-select:none}.wave canvas{width:100%;height:100%;display:block}.cursor{position:absolute;top:3px;bottom:3px;width:2px;background:white;pointer-events:none}.cursor.pending{background:#ffca70}.handle{position:absolute;right:5px;top:5px;padding:4px 8px;touch-action:none;z-index:2;background:#31465c}aside{background:#15202d;border-left:1px solid #34475a;overflow:auto}aside h3{padding:12px;margin:0;border-bottom:1px solid #34475a}#markers div{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding:12px;border-bottom:1px solid #34475a;cursor:pointer}#markers small{display:block;color:#9caec1}#empty{text-align:center;padding:70px 15px;color:#a6b8ca}footer{border-top:1px solid #36475b;border-bottom:0}.transport button{font-size:22px;min-width:55px}.transport #play{background:#e9edf3;color:#182436}#now{max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#now small{display:block;color:#9baec2;margin-top:6px}@media(max-width:700px){.workspace{grid-template-columns:minmax(0,1fr)}aside{display:none}.take{grid-template-columns:90px minmax(0,1fr)}header,footer{padding:8px}.project{font-size:12px}}
</style></head><body><header><strong>TAKE <small style="color:#96a9be">DEV 0.2.3</small></strong><div class="project">Untitled Project<small id="count">0 Takes</small></div><div><label class="pick" for="files">+ Add WAVs</label><input hidden id="files" type="file" multiple accept="audio/*,.wav,.aif,.aiff"><button id="fit">Fit</button><button id="focus">Focus</button></div></header><div class="workspace"><main><div class="bar">TAKES <span id="pinlabel"></span></div><div id="pinned"></div><div id="rows"></div><div id="empty">Choose a few WAV files to begin.<p>Each Take has its own time. Drag ⇆ to align waveforms visually.</p></div></main><aside><h3>Markers <button id="mark" style="float:right">+ Marker</button></h3><div id="markers"></div><p style="padding:12px;color:#91a6bc">Tap a waveform to cue its position, or tap its filename to cue from the beginning. Audio stays on this device.</p></aside></div><footer><div id="now">No Take selected<small id="clock">0:00.000</small></div><div class="transport"><button id="stop">■</button><button id="play">▶</button></div><div><button id="minus">−</button><span id="zoom">Fit</span><button id="plus">+</button></div></footer><script src="app.js?v=0.2.5"></script></body></html>
