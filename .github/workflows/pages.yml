name: Publish Take Audition (main and dev)
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out stable site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Check out development site
        uses: actions/checkout@v4
        with:
          ref: develop
          path: preview
      - name: Assemble both sites
        run: |
          mkdir -p site/dev
          cp preview/index.html preview/app.js site/dev/
          rm -rf site/.git
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
